# .github/workflows/ci.yml
name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  web-lint-typecheck:
    name: Web — lint + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  api-tests:
    name: API — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Set project root
        env:
          FIN_BP_PROJECT_ROOT: ${{ github.workspace }}
        run: |
          echo "FIN_BP_PROJECT_ROOT=$FIN_BP_PROJECT_ROOT" >> $GITHUB_ENV
      - run: pip install -e ".[dev]"
      - run: pytest -q
