[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-bp-api"
version = "0.1.0"
description = "Fin BP Portal API"
requires-python = ">=3.11"
readme = "README.md"
authors = [{ name = "Fin BP Team" }]

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "SQLAlchemy>=2.0.30",
    "asyncpg>=0.29.0",
    "PyYAML>=6.0.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "clickhouse-driver>=0.2.7",
    "redis>=5.0.4",
    # Data-integration parsers
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
