# business_lines/valuation/forecast.yaml
#
# Rolling Forecast profile for the valuation (估价部) business line.
# 报告数、估价额、回款天数、偏差率是核心前瞻 KPI.

line_id: valuation
line_name: "估价部"

series:
  - indicator_id: report_count
    name: 估价报告数
    frequency: monthly
    method: linear_trend
    horizon_months: 12
    historical_periods: 24

  - indicator_id: valuation_amount
    name: 估价总额
    frequency: monthly
    method: ema
    horizon_months: 12
    historical_periods: 24

  - indicator_id: valuation_bias_rate
    name: 重估偏差率
    frequency: monthly
    method: sma
    sma_window: 3
    horizon_months: 12
    historical_periods: 12

  - indicator_id: collection_days
    name: 回款周期
    frequency: monthly
    method: seasonal_naive
    horizon_months: 12
    historical_periods: 24

attribution:
  - id: market
    name: 市场因素
    drivers: [银行抵押规模, 二手房成交, 司法拍卖量]
  - id: capacity
    name: 产能因素
    drivers: [估价师入职, 培训认证, 工时利用率]
  - id: compliance
    name: 合规因素
    drivers: [估价规范更新, 监管检查, 内审通过率]
  - id: client
    name: 客户因素
    drivers: [客户付款周期, 续约谈判, 投诉处理]
