# business_lines/office-leasing/forecast.yaml
#
# Rolling Forecast profile for the office-leasing business line.

line_id: office-leasing
line_name: "写字楼租赁部"

series:
  - indicator_id: deal_area
    name: 成交面积
    frequency: monthly
    method: linear_trend
    horizon_months: 12
    historical_periods: 24

  - indicator_id: commission_revenue
    name: 佣金收入
    frequency: monthly
    method: ema
    horizon_months: 12
    historical_periods: 24

  - indicator_id: avg_deal_cycle
    name: 平均成交周期
    frequency: monthly
    method: sma
    sma_window: 3
    horizon_months: 12
    historical_periods: 12

  - indicator_id: per_broker_output
    name: 经纪人人均产能
    frequency: monthly
    method: seasonal_naive
    horizon_months: 12
    historical_periods: 24

attribution:
  - id: market
    name: 市场因素
    drivers: [写字楼空置率, 总部经济活跃度, 共享办公挤压]
  - id: supply
    name: 供给因素
    drivers: [新交付楼宇, 楼宇等级, 业主报价]
  - id: demand
    name: 需求因素
    drivers: [客户行业景气, 跨区搬迁, 扩租需求]
  - id: team
    name: 团队因素
    drivers: [经纪人流失率, 培训覆盖, 楼宇覆盖]
