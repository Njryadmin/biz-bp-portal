# infra/dbt/profiles.yml
# dbt connection profile for the Fin BP Portal.
#
# Used by both ``dbt run`` in the Airflow container and local dev.
# ``host: postgres`` is the docker-compose service name; for local
# invocation, override via ``DBT_HOST`` / environment.

finbp:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DBT_HOST', 'postgres') }}"
      port: "{{ env_var('DBT_PORT', '5432') | int }}"
      user: "{{ env_var('DBT_USER', 'finbp') }}"
      password: "{{ env_var('DBT_PASSWORD', 'finbp') }}"
      dbname: "{{ env_var('DBT_DBNAME', 'finbp') }}"
      schema: analytics
      threads: 4
